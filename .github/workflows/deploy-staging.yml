name: Deploy staging to Vercel

# Fallback deploy path (added 2026-07-16 while the Vercel GitHub App
# integration is disconnected). Requires one GitHub Actions secret:
#   VERCEL_TOKEN  — created by Haiden at vercel.com/account/tokens
# Org/project IDs are identifiers, not secrets.

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_DD4jppyOJU5ZSKliKVMVEzMS
      VERCEL_PROJECT_ID: prj_NAfy3ICgxAEiM8KtBsl7QJ5WUAKD
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Pull Vercel environment (preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy prebuilt to preview
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"
      - name: Alias staging domain
        run: vercel alias set ${{ steps.deploy.outputs.url }} staging.habitrii.aven4life.com --token=${{ secrets.VERCEL_TOKEN }}
